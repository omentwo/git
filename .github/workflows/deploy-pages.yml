name: Deploy Weather Report to GitHub Pages

on:
  # 天气工作流完成后启动
  workflow_run:
    workflows:
      - Advanced Weather Data Collector
    types:
      - completed
    branches:
      - main

  # 保留：人工直接修改报告时也能部署
  push:
    branches:
      - main
    paths:
      - weather-report.html

  # 保留手动部署入口
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_run 仅在天气任务成功时部署；
    # push 和手动触发则直接部署
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare Pages site
        run: |
          test -f weather-report.html
          mkdir -p site
          cp weather-report.html site/weather-report.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
