name: Advanced Weather Data Collector

on:
  schedule:
    # 每天 UTC 00:00 运行，即北京时间 08:00
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-weather:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Shanghai

    steps:
      # ---------- 基础步骤 ----------
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install axios

      # ---------- 获取天气数据 ----------
      - name: Run weather script to get data
        id: get-weather
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
          CITY_ADDRESS: "海南省海口市龙华区"

          # 优先使用 IPv4，减少 GitHub Runner 无 IPv6 路由造成的错误
          NODE_OPTIONS: "--dns-result-order=ipv4first"

        run: |
          WEATHER_FETCH_SUCCESS=false

          # 最多尝试 5 次，等待时间依次为 10、20、30、40 秒
          for ATTEMPT in 1 2 3 4 5; do
            echo "🌤️ 第 ${ATTEMPT}/5 次获取天气数据..."

            if node ./weather.js; then
              echo "✅ weather.js 执行成功"
              WEATHER_FETCH_SUCCESS=true
              break
            fi

            echo "⚠️ 第 ${ATTEMPT}/5 次获取失败"

            if [ "$ATTEMPT" -lt 5 ]; then
              WAIT_SECONDS=$((ATTEMPT * 10))
              echo "⏳ ${WAIT_SECONDS} 秒后重试..."
              sleep "$WAIT_SECONDS"
            fi
          done

          # 使用北京时间检查当天文件
          TODAY_DATE=$(TZ=Asia/Shanghai date +'%Y-%m-%d')
          WEATHER_FILE_PATH="weather-data/${TODAY_DATE}.json"

          if [ "$WEATHER_FETCH_SUCCESS" = "true" ] && [ -f "$WEATHER_FILE_PATH" ]; then
            echo "✅ Weather data file found: $WEATHER_FILE_PATH"
            echo "WEATHER_FILE_EXISTS=true" >> "$GITHUB_OUTPUT"
            echo "WEATHER_FILE_PATH=$WEATHER_FILE_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "❌ 获取天气数据失败，或当天文件不存在：$WEATHER_FILE_PATH"
            echo "WEATHER_FILE_EXISTS=false" >> "$GITHUB_OUTPUT"
            echo "WEATHER_FILE_PATH=$WEATHER_FILE_PATH" >> "$GITHUB_OUTPUT"
          fi

      # ---------- 检查天气数据文件 ----------
      - name: Validate weather data file presence
        if: steps.get-weather.outputs.WEATHER_FILE_EXISTS == 'false'
        run: |
          echo "❌ Critical Error: Today's weather data file was not generated."
          echo "高德天气接口可能暂时无法从 GitHub Runner 访问。"
          echo "后续将尝试生成错误提示报告。"

      # ---------- 提交天气数据 ----------
      - name: Commit weather data
        if: steps.get-weather.outputs.WEATHER_FILE_EXISTS == 'true'
        run: |
          git config --global user.name "omentwo"
          git config --global user.email "omentwo@users.noreply.github.com"

          git add weather-data/

          if git diff --staged --quiet; then
            echo "ℹ️ No changes in weather data to commit."
          else
            git commit -m "🌤️ 更新天气数据 $(date +'%Y-%m-%d %H:%M %Z')"
            git push
            echo "✅ Weather data committed."
          fi

      # ---------- 生成天气报告 HTML ----------
      - name: Generate weather report HTML
        id: generate-html-report
        run: |
          echo "🏃 Running generate_report.js..."

          # 删除旧报告，防止旧文件被误认为本次生成成功
          rm -f weather-report.html

          if node generate_report.js; then
            echo "✅ generate_report.js 执行完成"
          else
            echo "⚠️ generate_report.js 返回了非零状态码"
          fi

          if [ -f "weather-report.html" ]; then
            echo "✅ weather-report.html generated."
            echo "REPORT_GENERATED=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ weather-report.html was NOT generated."
            echo "REPORT_GENERATED=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------- 提交天气报告 HTML ----------
      - name: Commit weather report HTML
        if: steps.generate-html-report.outputs.REPORT_GENERATED == 'true'
        run: |
          git config --global user.name "omentwo"
          git config --global user.email "omentwo@users.noreply.github.com"

          git add weather-report.html

          if git diff --staged --quiet; then
            echo "ℹ️ No changes in weather-report.html to commit."
          else
            git commit -m "📈 更新天气可视化报告 $(date +'%Y-%m-%d %H:%M %Z')"
            git push
            echo "✅ Weather report HTML committed."
          fi

      # ---------- 自动清理旧数据 ----------
      - name: Clean old weather data files
        run: |
          echo "🧹 Cleaning old weather data (older than 30 days)..."

          # 按文件修改时间删除 30 天前的数据
          find weather-data/ -name "*.json" -mtime +30 -print -delete

          git config --global user.name "omentwo"
          git config --global user.email "omentwo@users.noreply.github.com"

          git add weather-data/

          if git diff --staged --quiet; then
            echo "ℹ️ No old weather data files were deleted."
          else
            git commit -m "🗑️ 清理30天前天气数据"
            git push
            echo "✅ Old weather data cleanup committed."
          fi
